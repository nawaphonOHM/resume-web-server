name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Pull Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: ${{ vars.PACKAGE_MANAGER }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Pretty Check
        run: npm run check-format

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Pull Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: ${{ vars.PACKAGE_MANAGER }}

      - name: Install Dependencies
        run: |
          npm ci
          git diff --exit-code package-lock.json || (echo "package-lock.json dirty" && exit 1)

      - name: Run unit tests
        run: npm run test:ci
